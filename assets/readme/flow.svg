<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img"
     aria-label="Три контура HDE_bot: приём события через durable inbox в топик, сборка черновика агентом с гейтами безопасности и self-check, ночная сверка черновика с ответом оператора">
  <defs>
    <style>
      .f { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .band  { font-size: 20px; font-weight: 600; letter-spacing: 2px; fill: #5FA8C4; }
      .box   { font-size: 21px; font-weight: 600; fill: #DCE7EF; }
      .sub   { font-size: 18px; font-weight: 400; fill: #7B8D9C; }
      .note  { font-size: 18px; font-weight: 400; fill: #6E8193; }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#3A5468"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1198" height="558" rx="18" fill="#0E1620" stroke="#1E2B38"/>

  <!-- ── band 1: приём ─────────────────────────────────────────────── -->
  <text x="60" y="58" class="f band">ПРИЁМ СОБЫТИЯ</text>
  <g>
    <rect x="60"  y="76" width="250" height="86" rx="12" fill="#16222D" stroke="#27394A"/>
    <text x="82"  y="112" class="f box">HDE webhook</text>
    <text x="82"  y="140" class="f sub">проверка секрета</text>

    <rect x="340" y="76" width="250" height="86" rx="12" fill="#16222D" stroke="#2AA0C8"/>
    <text x="362" y="112" class="f box">webhook_inbox</text>
    <text x="362" y="140" class="f sub">SQLite, lease + retry</text>

    <rect x="620" y="76" width="250" height="86" rx="12" fill="#16222D" stroke="#27394A"/>
    <text x="642" y="112" class="f box">dispatch</text>
    <text x="642" y="140" class="f sub">по типу события</text>

    <rect x="900" y="76" width="250" height="86" rx="12" fill="#16222D" stroke="#27394A"/>
    <text x="922" y="112" class="f box">forum topic</text>
    <text x="922" y="140" class="f sub">лок на тикет</text>

    <path d="M310 119 H336" stroke="#3A5468" stroke-width="2" marker-end="url(#a)"/>
    <path d="M590 119 H616" stroke="#3A5468" stroke-width="2" marker-end="url(#a)"/>
    <path d="M870 119 H896" stroke="#3A5468" stroke-width="2" marker-end="url(#a)"/>
  </g>
  <text x="60" y="192" class="f note">200 OK = событие сохранено, а не обработано: HDE не ретраит, потерянный вебхук — потерянный тикет.</text>

  <!-- ── band 2: черновик ──────────────────────────────────────────── -->
  <text x="60" y="252" class="f band">СБОРКА ЧЕРНОВИКА</text>
  <g>
    <rect x="60"  y="270" width="200" height="86" rx="12" fill="#16222D" stroke="#F2B01E"/>
    <text x="80"  y="306" class="f box">policy-гейт</text>
    <text x="80"  y="334" class="f sub">regex, до retrieval</text>

    <rect x="280" y="270" width="200" height="86" rx="12" fill="#16222D" stroke="#27394A"/>
    <text x="300" y="306" class="f box">контекст</text>
    <text x="300" y="334" class="f sub">evidence + demos</text>

    <rect x="500" y="270" width="200" height="86" rx="12" fill="#16222D" stroke="#27394A"/>
    <text x="520" y="306" class="f box">черновик</text>
    <text x="520" y="334" class="f sub">один JSON-вызов</text>

    <rect x="720" y="270" width="200" height="86" rx="12" fill="#16222D" stroke="#F2B01E"/>
    <text x="740" y="306" class="f box">safety</text>
    <text x="740" y="334" class="f sub">по тексту модели</text>

    <rect x="940" y="270" width="200" height="86" rx="12" fill="#16222D" stroke="#27394A"/>
    <text x="960" y="306" class="f box">self-check</text>
    <text x="960" y="334" class="f sub">опора на источники</text>

    <path d="M260 313 H276" stroke="#3A5468" stroke-width="2" marker-end="url(#a)"/>
    <path d="M480 313 H496" stroke="#3A5468" stroke-width="2" marker-end="url(#a)"/>
    <path d="M700 313 H716" stroke="#3A5468" stroke-width="2" marker-end="url(#a)"/>
    <path d="M920 313 H936" stroke="#3A5468" stroke-width="2" marker-end="url(#a)"/>
  </g>
  <text x="60" y="386" class="f note">Правила с последствиями — regex в коде, а не просьба в промпте. Сбой self-check деградирует в уточняющий вопрос.</text>

  <!-- ── band 3: ночью ─────────────────────────────────────────────── -->
  <text x="60" y="446" class="f band">НОЧЬЮ, БЕЗ УЧАСТИЯ ОПЕРАТОРА</text>
  <g>
    <rect x="60"  y="464" width="340" height="74" rx="12" fill="#16222D" stroke="#27394A"/>
    <text x="82"  y="496" class="f box">что бот предложил</text>
    <text x="82"  y="522" class="f sub">ai_suggestions</text>

    <rect x="430" y="464" width="340" height="74" rx="12" fill="#16222D" stroke="#2AA0C8"/>
    <text x="452" y="496" class="f box">сверка: LLM-судья</text>
    <text x="452" y="522" class="f sub">4 категории вместо порога</text>

    <rect x="800" y="464" width="340" height="74" rx="12" fill="#16222D" stroke="#27394A"/>
    <text x="822" y="496" class="f box">датасет + очередь в БЗ</text>
    <text x="822" y="522" class="f sub">решение по статье — за человеком</text>

    <path d="M400 501 H426" stroke="#3A5468" stroke-width="2" marker-end="url(#a)"/>
    <path d="M770 501 H796" stroke="#3A5468" stroke-width="2" marker-end="url(#a)"/>
  </g>
</svg>
